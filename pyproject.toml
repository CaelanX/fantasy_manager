[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-manager"
version = "0.1.0"
description = "Fantasy hockey manager for ESPN and Fantrax leagues: roster analysis, waivers, trades, injuries, news."
requires-python = ">=3.12"
dependencies = [
    "espn-api>=0.46",
    "fantraxapi>=1.0.1",
    "requests>=2.31",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "rapidfuzz>=3.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]

[project.scripts]
fm = "fantasy_manager.cli:app"

[tool.setuptools.packages.find]
include = ["fantasy_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
fantasy_manager = ["web/templates/*.html", "web/static/*.css", "valuation/fitted_params.json",
                    "valuation/nhle_factors.json"]
